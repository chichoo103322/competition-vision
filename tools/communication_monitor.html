<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>树莓派 ↔ STM32 · 通信监看</title>
<style>
:root{color-scheme:dark;--bg:#111619;--panel:#1a2227;--line:#47565e;--text:#edf2f4;--muted:#b7c4cc;--green:#60e8bc;--orange:#ffbe70;--red:#ff8c88;--blue:#8acbff}
*{box-sizing:border-box;scrollbar-color:#667985 #182126}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}::selection{background:#436c60;color:white}header{border-bottom:1px solid var(--line);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:600}header p{margin:3px 0 0;color:var(--muted);font-size:13px}a{color:var(--green);text-underline-offset:4px}main{max-width:1480px;margin:auto;padding:24px 28px}.statusbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}#fresh{font-weight:600;color:var(--orange)}.muted{color:var(--muted)}.summary{background:var(--panel);padding:18px 20px;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}dl{margin:0}dt{font-size:13px;color:var(--muted)}dd{margin:4px 0 0;font-size:17px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}dd small{display:block;font-size:12px;color:var(--muted)}#notice{color:var(--orange);white-space:pre-wrap;overflow-wrap:anywhere}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;color:var(--text);background:#25353e;border:1px solid #71858f;border-radius:5px;padding:7px 10px;min-height:40px}button{cursor:pointer}button:hover{background:#3c515c}input[type=search]{width:250px;max-width:100%;caret-color:var(--green)}input[type=checkbox]{min-height:0;accent-color:var(--green);width:16px;height:16px}label{display:flex;align-items:center;gap:7px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.download{margin-left:auto}h2{font-size:17px;font-weight:600;margin:0}.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:64vh;background:var(--panel)}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#222e35;text-align:left;font-size:12px;color:var(--muted);font-weight:500;position:sticky;top:0;z-index:1}th,td{padding:11px 14px;border-bottom:1px solid #35434b;vertical-align:top}th:nth-child(1){width:138px}th:nth-child(2){width:150px}td.time{font:12px/1.7 ui-monospace,SFMono-Regular,monospace;color:var(--muted)}td.direction{font-size:13px;color:var(--muted)}.TX{color:var(--blue)!important}.RX{color:var(--green)!important}.bad{color:var(--red)!important}.detail{color:var(--muted);font-size:13px;overflow-wrap:anywhere}details{margin-top:5px}summary{cursor:pointer;color:var(--muted);font-size:12px;display:inline-block}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;margin:8px 0;padding:12px;background:#11191e;border-radius:5px}.empty{padding:48px 20px;text-align:center;color:var(--muted)}footer{margin-top:14px;color:var(--muted);font-size:12px}#history{margin:12px 0}#count{font-size:13px;color:var(--muted)}.title{display:flex;justify-content:space-between;gap:12px}#network{color:var(--orange)}@media(max-width:740px){header{padding:16px}main{padding:18px 14px}.summary{grid-template-columns:1fr 1fr;gap:18px;padding:16px}th,td{padding:10px 8px}th:nth-child(1){width:92px}th:nth-child(2){width:82px}td.direction{font-size:12px}h1{font-size:20px}.download{margin-left:0}.toolbar{gap:9px}.tablewrap{max-height:60vh}input[type=search]{width:100%}.searchlabel{width:100%}.time span{display:block}dd{font-size:15px}}
</style>
<header><div><h1>树莓派 ↔ STM32 · 通信监看</h1><p>发送了什么、收到了什么，在这里看。</p></div><label>数据来源 <select id="source"><option value="test">底盘测试</option><option value="competition">正式比赛</option></select></label></header>
<main>
<div class="statusbar"><span id="fresh" role="status">正在读取日志…</span><span class="muted" id="rxAge">尚无返回记录</span><span id="network" role="status"></span></div>
<div class="summary">
<dl><dt>树莓派服务 · 最后记录</dt><dd id="service">—</dd></dl>
<dl><dt>STM32状态 · 最后返回</dt><dd id="controller">—</dd></dl>
<dl><dt>路线 / 航点索引</dt><dd id="route">—</dd></dl>
<dl><dt>位置 / 车头地图航向</dt><dd id="pose">—</dd></dl>
</div>
<p id="notice" role="status"></p><details id="history"><summary>上一次运行结果</summary><pre id="result">尚无记录</pre></details>
<div class="title"><h2>收发记录</h2><span id="count"></span></div>
<div class="toolbar">
<label>方向 <select id="direction"><option value="all">全部</option><option value="TX">Pi发送</option><option value="RX">STM32返回</option><option value="SYS">运行事件</option></select></label>
<label class="searchlabel"><input id="search" type="search" aria-label="搜索报文" placeholder="搜索 KEY1、STOP、路线号…"></label>
<label><input id="routine" type="checkbox">状态查询</label><label><input id="raw" type="checkbox">原始数据块</label>
<button id="pause" type="button">暂停记录滚动</button><a class="download" id="download" href="/download?source=test" download>下载完整当前日志</a>
</div>
<div class="tablewrap" id="scroll"><table><thead><tr><th>时间</th><th>方向</th><th>信号与内容</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">等待读取通信日志。</div></div>
<footer>页面每秒读取日志；暂停仅冻结下方列表，上方状态继续更新。航点索引从0开始，与work_id不同。发送记录表示写串口调用，是否接受需查看STM32回复。展开报文可查看原始十六进制与字段。下载文件包含查询及原始数据；更早的轮转日志保留在树莓派。</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const stateNames={EMPTY:'未载入路线',READY:'就绪',RUNNING:'运行中',WAIT_WORK:'等待作业',DONE:'全程完成',STOPPED:'已停止',FAULT:'故障'};
const serviceNames={WAIT_DEVICES:'等待设备',WARMING_UP:'传感器启动中',WAIT_CONTROLLER:'等待控制器就绪',READY:'等待实体按键',SCANNING:'扫描 / 规划 / 执行',DONE:'完成',FAILED:'失败'};
const eventNames={READY:'就绪，等待按键',WAIT_CONTROLLER:'等待控制器就绪',WAIT_DEVICES:'等待设备',WARMING_UP:'传感器启动',SCANNING:'已选区，准备运行',PREPARED:'路线准备完成',DONE:'本轮完成',FAILED:'本轮失败',STANDBY_RECONNECT:'重新建立待机通信',IGNORED_OLD_KEY:'忽略启动前旧按键',LIDAR_STARTED:'雷达后台启动',RUNNER:'路线执行记录',TEST_TURN_OBSTACLES_IGNORED:'测试配置：忽略转向障碍相交检查'};
let data=null,paused=false,displayEntries=[],source='test',signature='',expanded=new Set();
function timeText(t){return t?new Date(t*1000).toLocaleString('zh-CN',{hour12:false}):'—'}
function age(t){return t==null?'无记录':Math.max(0,Math.floor(Date.now()/1000-t))+'秒前'}
function put(id,text){$(id).textContent=text}
function describe(e){const d=e.details||{};let parts=[];if(d.route_id!=null)parts.push('路线 '+d.route_id);if(d.point_index!=null)parts.push('点索引 '+d.point_index+(d.point_count!=null?'/'+d.point_count:''));if(d.work_id!=null)parts.push('work_id '+d.work_id);if(d.x_mm!=null)parts.push(`X ${d.x_mm} / Y ${d.y_mm} mm · ${d.yaw_deg}°`);if(d.state_name)parts.push((stateNames[d.state_name]||d.state_name)+(d.phase!=null?' · '+(d.phase_name||({4:'等待作业',5:'连续路径行驶',6:'工作区原地转向'})[d.phase]||('phase '+d.phase)):''));if(d.chassis_fault||d.fault)parts.push(`故障 ${d.fault} / 底盘 ${d.chassis_fault} / 地址 ${d.fault_address}`);if(d.message)parts.push(d.message);if(d.error)parts.push(d.error);if(d.reason)parts.push(d.reason);if(d.action)parts.push(({status:'状态记录',test_station_dwell_start:'测试模式：到站校验通过，开始模拟作业',test_station_released:'测试模式：本站放行完成',upload_ready:'路线上传获接受',started:'START获接受'})[d.action]||d.action);if(d.selection)parts.push('启停区 '+d.selection.area);if(d.initial_pose)parts.push('初始位姿 '+JSON.stringify(d.initial_pose));if(d.success!=null)parts.push('success='+d.success);return parts.join(' · ')}
function render(){let entries=displayEntries.filter(e=>($('direction').value==='all'||e.direction===$('direction').value)&&(!e.raw||$('raw').checked)&&(!e.routine||e.raw||$('routine').checked));let q=$('search').value.trim().toLowerCase();if(q)entries=entries.filter(e=>JSON.stringify(e).toLowerCase().includes(q)||(eventNames[e.name]||'').includes(q));entries=entries.slice(-300).reverse();put('count',`${entries.length} 条显示 / 最近 ${displayEntries.length} 条记录`);const key=JSON.stringify(entries.map(e=>e.id));if(key===signature)return;signature=key;const fragment=document.createDocumentFragment();for(const e of entries){const tr=document.createElement('tr');const td=document.createElement('td');td.className='time';td.textContent=timeText(e.at);tr.append(td);const direction=document.createElement('td');direction.className='direction '+e.direction;direction.textContent=({TX:'Pi → STM32',RX:'STM32 → Pi',SYS:'运行事件'})[e.direction];tr.append(direction);const content=document.createElement('td');const title=document.createElement('div');title.textContent=eventNames[e.name]||e.name;if(e.error||(e.kind===128&&e.details?.code)||e.details?.fault||e.details?.chassis_fault)title.className='bad';content.append(title);const description=document.createElement('div');description.className='detail';description.textContent=describe(e);content.append(description);const details=document.createElement('details');details.open=expanded.has(e.id);details.addEventListener('toggle',()=>details.open?expanded.add(e.id):expanded.delete(e.id));const summary=document.createElement('summary');summary.textContent='查看报文'+(e.sequence!=null?' · 序号 '+e.sequence:'');details.append(summary);const pre=document.createElement('pre');pre.textContent=(e.error?'解析错误：'+e.error+'\n':'')+(e.hex?'HEX  '+e.hex+'\n\n':'')+JSON.stringify(e.details,null,2);details.append(pre);content.append(details);tr.append(content);fragment.append(tr)}$('rows').replaceChildren(fragment);$('empty').hidden=entries.length>0;put('empty',displayEntries.length?'当前筛选没有记录。可开启“状态查询”查看周期收发。':'尚无日志。等待对应后台服务记录通信。');const ids=new Set(displayEntries.map(e=>e.id));expanded=new Set([...expanded].filter(id=>ids.has(id)))}
function update(s){data=s;const c=s.controller,service=s.service;put('fresh',s.historical?'历史日志预览 · 非实时':s.controller_recent?'最近5秒收到有效控制器报文':'没有近期有效控制器报文');$('fresh').style.color=!s.historical&&s.controller_recent?'var(--green)':'var(--orange)';put('rxAge',`发送：${age(s.last_tx)} · 原始返回：${age(s.last_rx)} · 有效状态：${age(s.last_status_at)}`);put('service',service?(serviceNames[service.state]||service.state):'无服务记录');if(service){const small=document.createElement('small');small.textContent=timeText(service.at);$('service').append(small)}put('controller',c?`${stateNames[c.state_name]||c.state_name} · ${c.phase_name}`:'尚无有效返回');put('route',c?`${c.route_id} / ${c.point_index}（共${c.point_count}点）`:'—');put('pose',c?`${c.x_mm}, ${c.y_mm} mm / ${c.yaw_deg}°`:'—');let notes=[];if(s.warning)notes.push(s.warning);if(!s.controller_recent)notes.push('上方为最后记录，不代表车辆当前状态。请检查主控上电、接线和后台服务。');if(c&&(c.fault||c.chassis_fault))notes.push(`控制器最后回报故障：fault=${c.fault}，chassis_fault=${c.chassis_fault}，address=${c.fault_address}。`);if(service?.error)notes.push(service.error);if(s.last_key)notes.push(`最近实体按键：KEY${s.last_key.key} → 区${s.last_key.area} · ${timeText(s.last_key.at)}`);put('notice',notes.join('\n'));put('result',s.result?JSON.stringify(s.result,null,2):'尚无记录');if(!paused){displayEntries=s.entries;render()}}
async function poll(){const requested=source;try{const r=await fetch('/api/state?source='+encodeURIComponent(requested),{cache:'no-store',signal:AbortSignal.timeout(4500)});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();if(requested===source){put('network','');update(s)}}catch(e){if(requested===source){put('network','页面连接失败，正在自动重试。');put('fresh','监看数据已过期');$('fresh').style.color='var(--orange)';put('rxAge','最后成功读取：'+(data?timeText(data.now):'无'));}}finally{setTimeout(poll,1000)}}
$('source').onchange=()=>{source=$('source').value;data=null;displayEntries=[];expanded.clear();signature='reset';paused=false;put('pause','暂停记录滚动');for(const id of ['service','controller','route','pose'])put(id,'—');put('fresh','正在切换数据来源…');put('notice','');put('result','正在读取…');$('download').href='/download?source='+source;render()};for(const id of ['direction','search','routine','raw'])$(id).addEventListener('input',()=>{signature='reset';render()});$('pause').onclick=()=>{paused=!paused;put('pause',paused?'恢复实时记录':'暂停记录滚动');if(!paused&&data){displayEntries=data.entries;render()}};poll();
</script>
</html>
